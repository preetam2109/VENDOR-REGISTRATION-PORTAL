
<div class="container py-4">
    <div class="card shadow-lg border-0 rounded-3">
      <div class="card-header bg-dark text-white text-center">
        <h4 class="mb-0">Company Personal Details</h4>
      </div>
  
      <div class="card-body">
        <form>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold"> Name</label>
              <input type="text" class="form-control" [(ngModel)]="vendor.suppliername" name="suppliername">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold"> Address</label>
              <input type="text" class="form-control" [(ngModel)]="vendor.adddress" name="adddress">
            </div>
          </div>
  
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold"> City</label>
              <input type="text" class="form-control" [(ngModel)]="vendor.city" name="city">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold"> Mobile No</label>
              <input type="text" class="form-control" [(ngModel)]="vendor.phonE1" name="phonE1">
            </div>
          </div>
  
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold"> Email</label>
              <input type="email" class="form-control" [(ngModel)]="vendor.email" name="email">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Authorized Representative Name</label>
              <input type="text" class="form-control" [(ngModel)]="vendor.authname" name="authname">
            </div>
          </div>
  
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">Authorized Representative Mobile No</label>
              <input type="text" class="form-control" [(ngModel)]="vendor.authmobileno" name="authmobileno">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Authorized Representative Email</label>
              <input type="email" class="form-control" [(ngModel)]="vendor.authemail" name="authemail">
            </div>
          </div>
  
          <hr>
  
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">Authorized Signatory Name</label>
              <input type="text" class="form-control" [(ngModel)]="vendor.authsigname" name="authsigname">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Authorized Signatory Mobile No</label>
              <input type="text" class="form-control" [(ngModel)]="vendor.authsigmobileno" name="authsigmobileno">
            </div>
          </div>
  
          <div class="row mb-4">
            <div class="col-md-6">
              <label class="form-label fw-bold">Authorized Signatory Email</label>
              <input type="email" class="form-control" [(ngModel)]="vendor.authsigemailid" name="authsigemailid">
            </div>
          </div>

          <div class="row mb-4">
            <div class="col-md-6">
              <label class="form-label fw-bold">Add PAN Card</label>
              <input type="email" class="form-control" [(ngModel)]="vendor.authsigemailid" name="authsigemailid">
            </div>
          </div>
  
          <div class="text-center">
            <button type="button" class="btn btn-success px-4" (click)="saveVendor()">
              <i class="bi bi-save"></i> Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
