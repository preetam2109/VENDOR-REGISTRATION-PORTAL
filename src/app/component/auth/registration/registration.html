        <h4 class="mb-3 fw-bold ">Register to New account</h4>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Vendor Name:</label>
            <input type="email" class="form-control" placeholder="Enter your Name">
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address:</label>
            <input type="email" class="form-control" placeholder="Enter your email">
          </div>
          <div class="mb-3">
            <!-- <label class="form-label"> SUPPLIERTYPE</label> -->
            <label class="form-label">Vendor Type:</label>
            <input type="email" class="form-control" placeholder="Enter your Type">
          </div>
          <!-- <div class="mb-3">
            <label class="form-label">Company Name</label>
            <input type="text" class="form-control" placeholder="Enter your Company Name">
          </div> -->
          <div class="mb-3">
            <label class="form-label">PAN No:</label>
            <input type="text" class="form-control" placeholder="Enter your Pan No">
          </div>
          <div class="mb-3">
            <label class="form-label">Address Line 1:</label>
            <input type="text" class="form-control" placeholder="Enter your Address1">
          </div>
          <div class="mb-3">
            <label class="form-label">Address Line 2:</label>
            <input type="text" class="form-control" placeholder="Enter your Address2">
          </div>
          <div class="mb-3">
            <label class="form-label">Address Line 3:</label>
            <input type="text" class="form-control" placeholder="Enter your Address3">
          </div>
          <div class="mb-3">
            <label class="form-label">City:</label>
            <input type="text" class="form-control" placeholder="Enter your City">
          </div>
          <div class="mb-3">
            <label class="form-label">Country ID:</label>
            <input type="text" class="form-control" placeholder="Enter your Country ID:">
          </div>
          <div class="mb-3">
            <label class="form-label">ZIP Code:</label>
            <input type="text" class="form-control" placeholder="Enter your Country ID:">
          </div>
          <div class="mb-3">
            <label class="form-label">Mobile No:</label>
            <input type="number" class="form-control" placeholder="Enter your Mobile No">
          </div>
          <div class="mb-3">
            <label class="form-label">Password:</label>
            <input type="password" class="form-control" placeholder="Enter your password">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password:</label>
            <input type="password" class="form-control" placeholder="Enter your Confirm Password">
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="mb-3">
                <!-- <label class="form-label">Get OTP</label> -->
                <button type="button" class="btn btn-primary w-100 mb-2 small">Get OTP:</button>
                <!-- <input type="password" class="form-control" placeholder="Enter your Confirm Password"> -->
              </div>
            <div class="mb-3">
                <!-- <label class="form-label">Enter OTP</label> -->
                <input type="number" class="form-control" maxlength="6"  placeholder="Enter OTP">
              </div>
            <!-- <div class="form-check">

            </div>
            <a href="#" class="text-decoration-none small text-primary">Forgot Your Password?</a> -->
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2">Login</button>
          <button type="button" class="btn btn-outline-primary w-100">New Vendor Registration</button>
